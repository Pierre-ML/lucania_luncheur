[package]
name = "lanceur"
version = "1.0.1"
description = "Lucania Luncheur - installe, met à jour et lance les applications de Pierre-ML"
authors = ["Pierre Mouilleseaux Lhuillier"]
license = "MIT"
repository = "https://github.com/Pierre-ML/lucania_luncheur"
edition = "2024"
rust-version = "1.90"

[lib]
name = "lanceur_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.1", features = [] }
# Releases GitHub et registre distant (TLS rustls, sans OpenSSL). Racines webpki ET magasin de
# certificats Windows : les antivirus qui analysent le HTTPS présentent leur propre autorité.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "stream", "json"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Runtime déjà utilisé par Tauri : seulement les modules utiles (attentes, fichiers, annulation).
tokio = { version = "1", features = ["sync", "time", "fs", "io-util", "macros"] }

[target.'cfg(windows)'.dependencies]
# Registre (détection des installations), liste des processus et fenêtres (fermeture propre).
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.dev]
debug = 0
incremental = false
